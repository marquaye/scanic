version: 2
updates:
  # Keep GitHub Actions up to date (this is what caused the Node 20 deprecation surprise).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Keep npm dependencies current.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # The custom minimal wasm in scanic-ml/dist is ABI-locked to ONNX Runtime
      # 1.27 (see scanic-ml/README.md "Version pinning"). A newer onnxruntime-web
      # breaks ML detection in the browser while every Node test still passes.
      # Bump it by hand together with a scanic-ml rebuild; the guard in
      # src/onnxruntimeAbiVersion.test.js fails CI on a mismatch.
      - dependency-name: "onnxruntime-web"
        versions: [">=1.28.0"]
