name: Release and Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build WASM module
      run: |
        docker compose -f dev/docker-compose.yml up --build
        sudo chown -R "$(id -u):$(id -g)" wasm_blur/pkg
        node scripts/postprocess-wasm.mjs

    - name: Build project
      run: npm run build

    - name: Run tests
      run: npm test

    # Trusted publishing: npm verifies this workflow through GitHub's OIDC
    # token, so there is no NPM_TOKEN to create, store or renew. Needs npm
    # 11.5.1+ (Node 22 ships npm 10) and the trusted publisher entry on
    # npmjs.com (package settings: marquaye/scanic, workflow release.yml).
    - name: Update npm for trusted publishing
      run: npm install -g npm@^11.5.1

    - name: Publish to NPM
      run: npm publish --access public --provenance

    - name: Build release notes from CHANGELOG
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        {
          # Extract this version's section from CHANGELOG.md (between its heading
          # and the next "## [" heading). Literal match avoids regex bracket issues.
          awk -v hdr="## [$VERSION]" '
            index($0, hdr)==1 { flag=1; next }
            flag && index($0, "## [")==1 { exit }
            flag { print }
          ' CHANGELOG.md | sed '/./,$!d'

          echo ""
          echo "## Installation"
          echo ""
          echo '```bash'
          echo "npm install scanic@$VERSION"
          echo '```'
          echo ""
          echo "Or via CDN:"
          echo ""
          echo '```html'
          echo "<script src=\"https://unpkg.com/scanic@$VERSION/dist/scanic.js\"></script>"
          echo '```'
        } > RELEASE_NOTES.md
        echo "----- release notes -----"
        cat RELEASE_NOTES.md

    - name: Create Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body_path: RELEASE_NOTES.md
        generate_release_notes: true
        draft: false
        prerelease: false

    # GitHub Pages is deployed by the "Deploy Docs" workflow, which runs on the
    # accompanying push to main. Deploying here too would race it on the gh-pages
    # branch, so this workflow only handles npm publish + the GitHub release.
