name: Publish scanic-ml

on:
  push:
    tags:
      - 'scanic-ml-v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        registry-url: 'https://registry.npmjs.org'

    # Trusted publishing, see release.yml. The npmjs.com entry for scanic-ml
    # names the workflow publish-scanic-ml.yml.
    - name: Update npm for trusted publishing
      run: npm install -g npm@^11.5.1

    - name: Publish scanic-ml to NPM
      run: npm publish --access public --provenance
      working-directory: scanic-ml

    - name: Extract version from tag
      id: version
      run: echo "version=${GITHUB_REF_NAME#scanic-ml-v}" >> "$GITHUB_OUTPUT"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: scanic-ml v${{ steps.version.outputs.version }}
        body: |
          Optional ML assets for scanic's `detector: 'ml'` mode.

          **Install**
          ```bash
          npm install scanic-ml@${{ steps.version.outputs.version }}
          ```

          Most users don't install this directly. Scanic fetches the assets from jsDelivr at runtime. See the [ML detection guide](https://marquaye.github.io/scanic/guide/ml-detection) for details.
        draft: false
        prerelease: false
