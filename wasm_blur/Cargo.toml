[package]
name = "wasm_blur"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

# Smaller, faster wasm: whole-crate LTO in one codegen unit, and no unwinding
# machinery (a wasm panic is already a trap that the JS side catches).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
